
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lab-net

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    networks:
      - lab-net

  # Servidor HTTP/1.1
  web-http1:
    build:
      context: .
      dockerfile: webservers/Dockerfile
    depends_on:
      - backend
    ports:
      - "8441:443"
    volumes:
      - ./webservers/http1/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webservers/certs:/etc/nginx/certs:ro
    networks:
      - lab-net
    cpus: "1.0"
    mem_limit: 256m

  # Servidor HTTP/2
  web-http2:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - "8443:443"
    volumes:
      - ./webservers/http2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webservers/certs:/etc/nginx/certs:ro
    networks:
      - lab-net
    cpus: "1.0"
    mem_limit: 256m
  # Servidor HTTP/3 sobre QUIC
  web-http3:
    image: macbre/nginx-http3:latest
    depends_on:
      - backend
    ports:
      - "8444:443/tcp"
      - "8444:443/udp"
    volumes:
      - ./webservers/http3/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webservers/certs:/etc/nginx/certs:ro
    networks:
      - lab-net
    cpus: "1.0"
    mem_limit: 256m

networks:
  lab-net: