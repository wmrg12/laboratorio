
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lab-net

  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "3000:3000"
    networks:
      - lab-net

  web-http1:
    build:
      context: .
      dockerfile: webservers/Dockerfile
    depends_on:
      - backend
    ports:
      - "443:443"
    volumes:
      - ./webservers/certs:/etc/nginx/certs:ro
    networks:
      - lab-net

networks:
  lab-net:
