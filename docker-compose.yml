services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [lab-net]
  backend:
    build: ./backend
    depends_on: [db]
    ports: ["3000:3000"]
    networks: [lab-net]

  web-http1:
    image: nginx:1.27
    depends_on: [backend]
    ports: ["8441:443"]
    volumes:
      - ./webservers/http1/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webservers/certs:/etc/nginx/certs:ro
      - ./webservers/html:/usr/share/nginx/html:ro
    networks: [lab-net]
    
networks:
  lab-net:
